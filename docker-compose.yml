# API + worker + PostgreSQL (pgvector) + Redis (judge cache, job queue).
name: voice-agent-audit
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaa_local_dev}
      POSTGRES_DB: vaa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaa -d vaa"]
      interval: 3s
      retries: 20
    ports: ["127.0.0.1:5433:5432"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  api: &app
    build: .
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://vaa:${POSTGRES_PASSWORD:-vaa_local_dev}@db:5432/vaa
      VAA_BACKEND: ${VAA_BACKEND:-mock}
      VAA_MODEL: ${VAA_MODEL:-mock}
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Defaults need no download. Best measured setup: VAA_EMBEDDER=fastembed VAA_RETRIEVAL=hybrid
      VAA_EMBEDDER: ${VAA_EMBEDDER:-hash}
      VAA_RETRIEVAL: ${VAA_RETRIEVAL:-dense}
    volumes: [models:/home/app/.cache]
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: ["vaa", "worker"]
    restart: unless-stopped
    ports: []
volumes:
  pgdata:
  models:
